module.exports = "<app-header\r\n  [navbarBrandRouterLink]=\"['/dashboard']\"\r\n  [fixed]=\"true\"\r\n  [navbarBrandFull]=\"{src: 'assets/img/brand/web-logo.png', width: 140, height: 25, alt: 'BK Logo'}\"\r\n  [navbarBrandMinimized]=\"{src: 'assets/img/brand/web-logo.png', width: 30, height: 30, alt: 'BK Logo'}\"\r\n  [sidebarToggler]=\"false\"\r\n  [asideMenuToggler]=\"false\"\r\n  [mobileAsideMenuToggler]=\"false\">\r\n  <ul class=\"nav navbar-nav ml-auto mr-4\">\r\n    <li class=\"nav-item dropdown circle\" dropdown placement=\"bottom right\">\r\n      <a class=\"nav-link\" data-toggle=\"dropdown\" href=\"#\" role=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" dropdownToggle (click)=\"false\">\r\n        {{userName}}\r\n      </a>\r\n      <div class=\"dropdown-menu dropdown-menu-right\" *dropdownMenu aria-labelledby=\"simple-dropdown\">\r\n        <div class=\"dropdown-header text-center\"><strong>Account</strong></div>\r\n\r\n\r\n        <a class=\"dropdown-item\" (click)=\"redirectToProfile()\" style=\"cursor: pointer;\"><i class=\"fa fa-user\"></i> User profile</a>\r\n        <a class=\"dropdown-item\" (click)=\"redirectToResetPassword()\" style=\"cursor: pointer;\"><i class=\"fa fa-key\"></i> Change password</a>\r\n        <a class=\"dropdown-item\" (click)=\"logout()\" style=\"cursor: pointer;\"><i class=\"fa fa-lock\"></i> Logout</a>\r\n      </div>\r\n    </li>\r\n  </ul>\r\n</app-header>\r\n<div class=\"app-body\">\r\n  <app-sidebar [fixed]=\"true\" [display]=\"'lg'\">\r\n    <app-sidebar-nav [navItems]=\"sb_navitems\" [perfectScrollbar] [disabled]=\"sidebarMinimized\"></app-sidebar-nav>\r\n\r\n  </app-sidebar>\r\n  <!-- Main content -->\r\n  <main class=\"main\">\r\n    <!-- Breadcrumb -->\r\n    <!-- breaking change 'cui-breadcrumb' -->\r\n    <!-- <cui-breadcrumb>\r\n      <li class=\"breadcrumb-menu d-md-down-none\">\r\n        <div class=\"btn-group\" role=\"group\" aria-label=\"Button group with nested dropdown\">\r\n\r\n\r\n        </div>\r\n      </li>\r\n    </cui-breadcrumb> -->\r\n    <div class=\"container-fluid\">\r\n      <router-outlet></router-outlet>\r\n    </div><!-- /.container-fluid -->\r\n    <ng-snotify></ng-snotify>\r\n  </main>\r\n</div>\r\n"
