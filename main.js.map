module.exports = "<div class=\"app-body\">\n    <main class=\"main d-flex align-items-center\">\n        <div class=\"container\">\n            <div class=\"row\">\n                <div class=\"col-md-8 mx-auto\">\n                    <div class=\"card-group\">\n                        <div class=\"card p-4\">\n                            <div class=\"card-body\">\n                                <form [formGroup]=\"resetForm\" (ngSubmit)=\"onSubmit()\">\n                                    <h1 class=\"text-center\">Forgot Password</h1>\n                                    <p class=\"text-muted\">Enter your Email Id</p>\n\n                                    <div class=\"form-group\">\n                                        <label for=\"email\">Email Id</label>\n                                        <input type=\"email\" formControlName=\"email\" class=\"form-control\" />\n                                        <div *ngIf=\"(message != '')\" class=\"erroralert\">\n                                            <div>{{ message }}</div>\n                                        </div>\n                                    </div>\n                                    <div class=\"mt-2 d-inline-block float-right\">\n                                        <label class=\"make-link\" (click)=\"navigateToLogin()\"\n                                            for=\"forgetPassword\">Login Again</label>\n                                    </div>\n                                    <button [disabled]=\"submitted\" class=\"px-4 btn btn-primary\">\n                                        <span *ngIf=\"submitted\" class=\" spinner-border spinner-border-sm mr-1\"></span>\n                                        Reset\n                                    </button>\n                                </form>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </main>\n    <ng-snotify></ng-snotify>\n</div>\n"
